# Perfil de pruebas: base de datos H2 en memoria, no necesita Docker.
# Al iniciar se cargan schema.sql y data.sql de src/test/resources.
spring.datasource.url=jdbc:h2:mem:viajaya;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.show-sql=false
